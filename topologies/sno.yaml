## Single Node OpenShift (SNO) topology.
##
## Models a cluster where one host runs the full control plane plus
## all cluster operators plus worker workloads. Process counts and
## profiles are best-effort estimates — tune from a real `crictl ps`
## + `ps -eLf` snapshot when you have one. The `ideal_threads` field
## is informational; `gomaxprocs: 0` means "use Go's default" (which
## is exactly the failure mode this harness exists to reproduce).
host_type: sno
description: "Single Node OpenShift — full control plane + workload on one host"

components:
  # ---------------- Core control plane ----------------
  - name: etcd
    role: control-plane-data
    description: "etcd key-value store (raft, fsync-heavy)"
    processes:
      - profile: etcd-like
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 8

  - name: kube-apiserver
    role: control-plane
    processes:
      - profile: control-plane
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 8

  - name: kube-controller-manager
    role: control-plane
    processes:
      - profile: control-plane
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 4

  - name: kube-scheduler
    role: control-plane
    processes:
      - profile: control-plane
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 4

  - name: openshift-apiserver
    role: control-plane
    processes:
      - profile: control-plane
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 4

  - name: openshift-oauth-apiserver
    role: control-plane
    processes:
      - profile: control-plane
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 2

  - name: openshift-controller-manager
    role: control-plane
    processes:
      - profile: control-plane
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 2

  - name: cluster-policy-controller
    role: control-plane
    processes:
      - profile: control-plane
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 2

  - name: openshift-route-controller-manager
    role: control-plane
    processes:
      - profile: control-plane
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 2

  # ---------------- Cluster operators ----------------
  - name: cluster-version-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 2
  - name: cluster-network-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 2
  - name: cluster-storage-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: cluster-image-registry-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: cluster-monitoring-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: cluster-authentication-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: cluster-ingress-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: cluster-dns-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: cluster-node-tuning-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: machine-api-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: machine-config-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: machine-config-daemon
    role: node-agent
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: machine-approver
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: console-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: service-ca-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: kube-apiserver-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: kube-controller-manager-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: kube-scheduler-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: etcd-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: openshift-apiserver-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: openshift-config-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: cluster-csi-snapshot-controller-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: cluster-samples-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: olm-operator
    role: operator
    description: "Operator Lifecycle Manager"
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: catalog-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: package-server-manager
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0

  # ---------------- Networking ----------------
  - name: ovnkube-node
    role: network
    description: "OVN-Kubernetes node-side controller"
    processes:
      - profile: networking
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 4
  - name: ovnkube-controller
    role: network
    description: "OVN-Kubernetes cluster manager (master in SNO)"
    processes:
      - profile: networking
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 4
  - name: multus
    role: network
    processes:
      - profile: networking
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 2
  - name: network-metrics-daemon
    role: network
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0

  # ---------------- DNS / Routing ----------------
  - name: coredns
    role: dns
    processes:
      - profile: networking
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 2
  - name: router-default
    role: ingress
    description: "HAProxy-based ingress (still has Go monitor sidecar)"
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0

  # ---------------- Monitoring stack ----------------
  - name: prometheus-k8s
    role: monitoring
    processes:
      - profile: monitoring
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 4
  - name: prometheus-user-workload
    role: monitoring
    processes:
      - profile: monitoring
        replicas: 1
        gomaxprocs: 0
  - name: alertmanager
    role: monitoring
    processes:
      - profile: monitoring
        replicas: 1
        gomaxprocs: 0
  - name: thanos-querier
    role: monitoring
    processes:
      - profile: monitoring
        replicas: 1
        gomaxprocs: 0
  - name: prometheus-operator
    role: operator
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: kube-state-metrics
    role: monitoring
    processes:
      - profile: monitoring
        replicas: 1
        gomaxprocs: 0
  - name: openshift-state-metrics
    role: monitoring
    processes:
      - profile: monitoring
        replicas: 1
        gomaxprocs: 0
  - name: node-exporter
    role: monitoring
    processes:
      - profile: monitoring
        replicas: 1
        gomaxprocs: 0
  - name: telemeter-client
    role: monitoring
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0

  # ---------------- Logging (optional, included in SNO baseline) ----------------
  - name: vector
    role: logging
    description: "Log forwarder (high-allocation profile)"
    processes:
      - profile: logging
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 4

  # ---------------- Image registry & misc ----------------
  - name: image-registry
    role: registry
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: console
    role: console
    description: "OpenShift web console (Go backend)"
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: oauth-proxy
    role: ingress-auth
    processes:
      - profile: operator-generic
        replicas: 1
        gomaxprocs: 0
  - name: kubelet
    role: node-agent
    description: "Node agent — control loop + container manager"
    processes:
      - profile: control-plane
        replicas: 1
        gomaxprocs: 0
        ideal_threads: 4
